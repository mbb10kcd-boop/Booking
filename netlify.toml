# Netlify-opsætning for pedel-appen (statisk frontend, ingen build).
# Alle /api/*-kald sendes videre til det eksisterende bookingsystem, så login-cookien
# ligger på appens eget domæne (ingen CORS, ingen hemmeligheder i frontend).
# Repoet indeholder også selve bookingsystemet (Next.js), som kører på Render - IKKE på Netlify.
# Netlify må derfor ikke forsøge at bygge det eller installere sit Next.js-plugin (det giver "plugin error").
[build]
  publish = "pedel-app"
  command = "echo 'Ingen build - statisk app'"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/api/*"
  to = "https://booking.grenaaic.dk/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
